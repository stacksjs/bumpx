name: Releaser

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and finalize
        required: true
        type: string

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Verify the immutable release source
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]]
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@368bc91e4bc5bb1c42b7c4abc7f910b79743733c # v0.11.97
        with:
          version: '0.11.97'
          install: 'false'
          packages: 'bun.com@1.4.2 git-scm.org@2.53.0 curl.se@8.22.0 info-zip.org/zip@3.0.0'

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # Native ZIPs must exist even when npm correctly skips packages already
      # accepted by an earlier attempt. Such a skip does not run prepublishOnly.
      - name: Build the release artifacts
        run: bun run --cwd packages/bumpx prepublishOnly

      - name: Publish
        run: pantry publish --npm --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: stacksjs/action-releaser@cc6cd61791cf7556459ca35ad536800561277e3e # v1.2.11
        with:
          tag: ${{ inputs.tag || github.ref_name }}
          files: |
            packages/bumpx/bin/bumpx-linux-x64.zip
            packages/bumpx/bin/bumpx-linux-arm64.zip
            packages/bumpx/bin/bumpx-windows-x64.zip
            packages/bumpx/bin/bumpx-darwin-x64.zip
            packages/bumpx/bin/bumpx-darwin-arm64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
