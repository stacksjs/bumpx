name: Releaser

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1
        with:
          fetch-depth: 0

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@368bc91e4bc5bb1c42b7c4abc7f910b79743733c # v0.11.97
        with:
          version: '0.11.97'
          install: 'false'
          packages: 'bun.com@1.4.2 git-scm.org@2.53.0 curl.se@8.22.0'

      - name: Install Dependencies
        run: bun install

      - name: Publish
        run: pantry publish --npm --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: stacksjs/action-releaser@cc6cd61791cf7556459ca35ad536800561277e3e # v1.2.11
        with:
          files: |
            packages/bumpx/bin/bumpx-linux-x64.zip
            packages/bumpx/bin/bumpx-linux-arm64.zip
            packages/bumpx/bin/bumpx-windows-x64.zip
            packages/bumpx/bin/bumpx-darwin-x64.zip
            packages/bumpx/bin/bumpx-darwin-arm64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
